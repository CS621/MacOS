name: macOS via OSX-KVM & Ngrok

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Enable KVM & Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils libvirt-daemon-system libvirt-clients bridge-utils ngrok
          sudo chmod 666 /dev/kvm

      - name: Clone OSX-KVM Repo
        run: |
          git clone --depth 1 https://github.com/kholia/OSX-KVM.git
          cd OSX-KVM
          chmod +x *.sh *.py

      - name: Fetch macOS BaseSystem
        run: |
          cd OSX-KVM
          ./fetch-macOS-v2.py -s Ventura

      - name: Convert DMG to IMG
        run: |
          cd OSX-KVM
          qemu-img convert BaseSystem.dmg -O raw BaseSystem.img
          qemu-img create -f qcow2 mac_hdd_ng.img 64G

      - name: Configure Ngrok Authtoken
        run: |
          ngrok config add-authtoken ${{ secrets.NGROK_AUTHTOKEN }}

      - name: Launch QEMU macOS & Start Ngrok TCP Tunnel
        run: |
          cd OSX-KVM
          qemu-system-x86_64 \
            -enable-kvm \
            -m 3072 \
            -smp 2,sockets=1,cores=2,threads=1 \
            -cpu Haswell-noTSX,vendor=GenuineIntel,+invtsc,+hypervisor \
            -machine pc-q35-4.2 \
            -usb -device usb-kbd -device usb-tablet \
            -device isa-applesmc,osk="ourhardworkbythesewordsguardedpleasedontsteal(c)AppleComputerInc" \
            -drive if=pflash,format=raw,readonly=on,file=OVMF_CODE.fd \
            -drive if=pflash,format=raw,file=OVMF_VARS-1024x768.fd \
            -smbios type=2 \
            -device ich9-intel-hda -device hda-duplex \
            -drive id=BaseSystem,if=ide,index=1,media=cdrom,file=BaseSystem.img \
            -drive id=SystemDisk,if=ide,index=2,file=mac_hdd_ng.img,format=qcow2 \
            -vnc 0.0.0.0:0 &

          sleep 10
          echo "Starting Ngrok TCP tunnel on port 5900..."
          ngrok tcp 5900 > /dev/null &
          sleep 5

      - name: Get Ngrok VNC Address
        run: |
          curl -s http://localhost:4040/api/tunnels | grep -o 'tcp://[^"]*' || echo "Tunnel loading failed"

      - name: Keep Alive (6 Hours Max)
        run: sleep 21600
