name: macOS Remote Access Workflow

on:
  workflow_dispatch:

jobs:
  macos-build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configure VNC and Remote Management
      run: |
        # sysadminctl se safely password set karna
        sudo sysadminctl -resetPasswordFor runner -newPassword "P@ssword1234!"
        
        # Native Remote Desktop / VNC enable karna
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
          -activate -configure -access -on \
          -privs -all -allowAccessFor -allUsers
        
        # SSH Access enable karna
        sudo systemsetup -setremotelogin on

    - name: Install and Setup Tailscale via Homebrew
      env:
        TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      run: |
        brew install tailscale
        sudo /opt/homebrew/opt/tailscale/bin/tailscaled --state=mem: &
        sleep 5
        sudo /opt/homebrew/bin/tailscale up --authkey=$TAILSCALE_AUTHKEY --hostname=github-mac-runner

    - name: Display Connection Details
      run: |
        MAC_IP=$(/opt/homebrew/bin/tailscale ip -4)
        echo "=================================================="
        echo "  macOS Connection Info"
        echo "=================================================="
        echo " Tailscale IP : $MAC_IP"
        echo " VNC Address  : vnc://$MAC_IP:5900"
        echo " SSH Address  : ssh runner@$MAC_IP"
        echo " Username     : runner"
        echo " Password     : P@ssword1234!"
        echo "=================================================="

    - name: Keep Alive (Limits Bypass Loop)
      run: |
        echo "Starting keep-alive engine..."
        while true; do
          echo "Runner active at $(date)"
          sleep 300
        done
