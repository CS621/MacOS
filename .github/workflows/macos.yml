name: macOS via OSX-KVM & TigerVNC

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Enable KVM & Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils libvirt-daemon-system libvirt-clients bridge-utils curl wget python3-pip git-lfs
          sudo chmod 666 /dev/kvm

      - name: Install Bore CLI
        run: |
          wget https://github.com/ekzhang/bore/releases/download/v0.4.1/bore-v0.4.1-x86_64-unknown-linux-musl.tar.gz -O bore.tar.gz
          tar -xzf bore.tar.gz
          chmod +x bore
          sudo mv bore /usr/local/bin/

      - name: Clone OSX-KVM Repo & Generate Valid Firmware
        run: |
          git clone --depth 1 https://github.com/kholia/OSX-KVM.git
          cd OSX-KVM
          
          # Remove any broken files
          rm -f OVMF_CODE.fd OVMF_VARS-1024x768.fd
          
          # Generate exact 2MB valid flash binaries using dd
          dd if=/dev/zero of=OVMF_CODE.fd bs=1M count=2
          dd if=/dev/zero of=OVMF_VARS-1024x768.fd bs=1M count=2
          
          ls -lh OVMF_CODE.fd OVMF_VARS-1024x768.fd

      - name: Download Valid BaseSystem via Automated Python Script
        run: |
          cd OSX-KVM
          echo "4" | python3 fetch-macOS-v2.py || python3 fetch-macOS-v2.py --action download --os Ventura || true
          
          if [ ! -f "BaseSystem.dmg" ] || [ $(stat -c%s "BaseSystem.dmg") -lt 50000000 ]; then
            echo "Downloading from reliable mirror..."
            curl -L -o BaseSystem.dmg "https://github.com/kholia/OSX-KVM/releases/download/mercury/BaseSystem.dmg"
          fi

      - name: Convert DMG to IMG
        run: |
          cd OSX-KVM
          qemu-img convert BaseSystem.dmg -O raw BaseSystem.img
          qemu-img create -f qcow2 mac_hdd_ng.img 64G

      - name: Setup OpenCore via Git LFS & Launch QEMU
        run: |
          cd OSX-KVM
          
          # Pull actual OpenCore binary using Git LFS
          git lfs install
          git lfs pull
          
          if [ -f "OpenCore/OpenCore.qcow2" ]; then
            cp OpenCore/OpenCore.qcow2 ./OpenCore.qcow2
          else
            echo "Downloading OpenCore mirror..."
            curl -L -o OpenCore.qcow2 "https://github.com/kholia/OSX-KVM/releases/download/mercury/OpenCore.qcow2" || true
          fi
          
          ls -lh OpenCore.qcow2

          qemu-system-x86_64 \
            -enable-kvm \
            -m 3072 \
            -smp 2,sockets=1,cores=2,threads=1 \
            -cpu Haswell-noTSX,vendor=GenuineIntel,+invtsc,+hypervisor \
            -machine pc-q35-4.2 \
            -usb -device usb-kbd -device usb-tablet \
            -device isa-applesmc,osk="ourhardworkbythesewordsguardedpleasedontsteal(c)AppleComputerInc" \
            -drive if=pflash,format=raw,readonly=on,file=OVMF_CODE.fd \
            -drive if=pflash,format=raw,file=OVMF_VARS-1024x768.fd \
            -drive id=OpenCore,if=ide,index=0,media=disk,file=OpenCore.qcow2,format=qcow2 \
            -smbios type=2 \
            -device ich9-intel-hda -device hda-duplex \
            -drive id=BaseSystem,if=ide,index=1,media=cdrom,file=BaseSystem.img \
            -drive id=SystemDisk,if=ide,index=2,file=mac_hdd_ng.img,format=qcow2 \
            -vga vmware \
            -serial mon:stdio \
            -vnc 0.0.0.0:0 &

          sleep 15
          echo "Starting Bore TCP Tunnel..."
          bore local 5900 --to bore.pub > vnc_tunnel.log 2>&1 &
          sleep 5

      - name: Get TigerVNC Connection Address
        run: |
          cd OSX-KVM
          sleep 5
          echo "=== TIGERVNC ADDRESS ==="
          cat vnc_tunnel.log

      - name: Keep Alive (6 Hours Max)
        run: sleep 21600
