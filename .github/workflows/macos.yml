name: macOS via Cloudflare Tunnel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Enable KVM & Setup Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils curl
          sudo chmod 666 /dev/kvm

      - name: Run macOS Docker Container
        run: |
          docker run -d \
            --name macos \
            --device /dev/kvm \
            -p 5900:5900 \
            -e RAM=3G \
            -e SMP=2 \
            -e CORES=2 \
            -e EXTRA='-vnc 0.0.0.0:0' \
            sickcodes/docker-osx:latest

      - name: Install Cloudflare Tunnel (cloudflared)
        run: |
          curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Expose VNC via Cloudflare TCP Tunnel
        run: |
          echo "Waiting for QEMU VNC to initialize..."
          sleep 60
          cloudflared tunnel --url tcp://localhost:5900 &
          sleep 15

      - name: Keep Alive (6 Hours Max)
        run: sleep 21600
