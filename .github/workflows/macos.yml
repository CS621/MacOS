- name: Run macOS Docker Container (Fast Boot)
        run: |
          docker run -d \
            --name macos \
            --device /dev/kvm \
            -p 5900:5900 \
            -p 3389:3389 \
            -e RAM=4G \
            -e SMP=2 \
            -e CORES=2 \
            -e EXTRA='-display none -vnc :0,password=on' \
            sickcodes/docker-osx:high-sierra
