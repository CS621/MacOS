name: macOS Docker-OSX via Tailscale

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Enable KVM & Setup Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils freerdp2-x11
          sudo chmod 666 /dev/kvm

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci

      - name: Run macOS Docker Container
        run: |
          docker run -d \
            --name macos \
            --device /dev/kvm \
            -p 5900:5900 \
            -p 3389:3389 \
            -e RAM=4G \
            -e SMP=2 \
            -e CORES=2 \
            sickcodes/docker-osx:latest

      - name: Wait for Sequoia Download & Boot
        run: |
          echo "Waiting for macOS image to download and boot..."
          for i in {1..30}; do
            if docker logs macos 2>&1 | grep -q "Booting from"; then
              echo "macOS is booting up!"
              break
            fi
            sleep 15
          done
          docker logs macos --tail 30

      - name: Check QEMU Process Status
        run: |
          docker exec macos ps aux || echo "Container process check failed"

      - name: Show Tailscale IP
        run: |
          echo "=========================================="
          echo "Connect via xfreerdp to Tailscale IP:"
          tailscale ip -4
          echo "=========================================="

      - name: Keep Alive (6 Hours Max)
        run: sleep 21600
