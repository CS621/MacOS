name: macOS via OSX-KVM & TigerVNC

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Enable KVM & Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils libvirt-daemon-system libvirt-clients bridge-utils curl wget python3-pip openssh-client
          sudo chmod 666 /dev/kvm

      - name: Clone OSX-KVM Repo
        run: |
          git clone --depth 1 https://github.com/kholia/OSX-KVM.git

      - name: Download Valid BaseSystem via Automated Python Script
        run: |
          cd OSX-KVM
          echo "4" | python3 fetch-macOS-v2.py || python3 fetch-macOS-v2.py --action download --os Ventura || true
          
          if [ ! -f "BaseSystem.dmg" ] || [ $(stat -c%s "BaseSystem.dmg") -lt 50000000 ]; then
            echo "Downloading from reliable mirror..."
            curl -L -o BaseSystem.dmg "https://github.com/kholia/OSX-KVM/releases/download/mercury/BaseSystem.dmg"
          fi

      - name: Convert DMG to IMG
        run: |
          cd OSX-KVM
          qemu-img convert BaseSystem.dmg -O raw BaseSystem.img
          qemu-img create -f qcow2 mac_hdd_ng.img 64G

      - name: Launch QEMU macOS & Start Pinggy TCP Tunnel
        run: |
          cd OSX-KVM
          if [ ! -f "OVMF_CODE.fd" ]; then
            curl -L -o OVMF_CODE.fd "https://raw.githubusercontent.com/kholia/OSX-KVM/master/firmware/OVMF_CODE.fd" || wget -O OVMF_CODE.fd "https://raw.githubusercontent.com/kholia/OSX-KVM/master/firmware/OVMF_CODE.fd"
          fi
          if [ ! -f "OVMF_VARS-1024x768.fd" ]; then
            curl -L -o OVMF_VARS-1024x768.fd "https://raw.githubusercontent.com/kholia/OSX-KVM/master/firmware/OVMF_VARS-1024x768.fd" || wget -O OVMF_VARS-1024x768.fd "https://raw.githubusercontent.com/kholia/OSX-KVM/master/firmware/OVMF_VARS-1024x768.fd"
          fi

          # Launch QEMU with robust VNC binding on 0.0.0.0:5900
          qemu-system-x86_64 \
            -enable-kvm \
            -m 3072 \
            -smp 2,sockets=1,cores=2,threads=1 \
            -cpu Haswell-noTSX,vendor=GenuineIntel,+invtsc,+hypervisor \
            -machine pc-q35-4.2 \
            -usb -device usb-kbd -device usb-tablet \
            -device isa-applesmc,osk="ourhardworkbythesewordsguardedpleasedontsteal(c)AppleComputerInc" \
            -drive if=pflash,format=raw,readonly=on,file=OVMF_CODE.fd \
            -drive if=pflash,format=raw,file=OVMF_VARS-1024x768.fd \
            -smbios type=2 \
            -device ich9-intel-hda -device hda-duplex \
            -drive id=BaseSystem,if=ide,index=1,media=cdrom,file=BaseSystem.img \
            -drive id=SystemDisk,if=ide,index=2,file=mac_hdd_ng.img,format=qcow2 \
            -vnc :0 &

          sleep 12
          echo "Starting SSH Tunnel for TigerVNC..."
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R 0:localhost:5900 a.pinggy.io > vnc_tunnel.log 2>&1 &
          sleep 10

      - name: Get TigerVNC Connection Address
        run: |
          cd OSX-KVM
          sleep 5
          echo "=== TIGERVNC ADDRESS ==="
          cat vnc_tunnel.log

      - name: Keep Alive (6 Hours Max)
        run: sleep 21600
