name: macOS Docker-OSX via Tailscale

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Enable KVM & Setup Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils freerdp2-x11
          sudo chmod 666 /dev/kvm

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci

      - name: Run macOS Docker Container
        run: |
          docker run -d \
            --name macos \
            --device /dev/kvm \
            -p 5900:5900 \
            -p 3389:3389 \
            -e RAM=3G \
            -e SMP=2 \
            -e CORES=2 \
            sickcodes/docker-osx:big-sur

      - name: Monitor Boot Status
        run: |
          echo "Waiting for Big Sur to initialize..."
          sleep 40
          docker ps
          docker logs macos --tail 30

      - name: Show Tailscale IP
        run: |
          echo "=========================================="
          echo "Connect via VNC or RDP to Tailscale IP:"
          tailscale ip -4
          echo "=========================================="

      - name: Keep Alive (6 Hours Max)
        run: sleep 21600
